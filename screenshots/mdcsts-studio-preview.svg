<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="darkbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="16" fill="url(#darkbg)" stroke="#1f2937" stroke-width="2" />

  <!-- App Header -->
  <rect x="24" y="20" width="952" height="50" rx="8" fill="url(#card)" stroke="#334155" />
  <text x="40" y="52" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">MDCSTSForge Pro | CCSDS 922.1-B-2 Monitored Data Studio</text>
  <rect x="800" y="32" width="160" height="26" rx="13" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" />
  <circle cx="816" cy="45" r="4" fill="#34d399" />
  <text x="828" y="49" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">STATUS: 10/10 PASS</text>

  <!-- Left Sidebar -->
  <rect x="24" y="86" width="280" height="488" rx="10" fill="url(#card)" stroke="#334155" />
  <text x="40" y="116" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">SERVICE CONFIGURATION</text>
  
  <rect x="40" y="136" width="248" height="36" rx="6" fill="#0b0f19" stroke="#38bdf8" />
  <text x="52" y="159" font-family="sans-serif" font-size="11" fill="#ffffff">DSN-DSS-26 (Goldstone 34m)</text>

  <text x="40" y="196" font-family="sans-serif" font-size="11" fill="#94a3b8">BOUND USER / MOC</text>
  <rect x="40" y="206" width="248" height="36" rx="6" fill="#0b0f19" stroke="#334155" />
  <text x="52" y="229" font-family="sans-serif" font-size="12" fill="#ffffff">MOC-JUICE-OPS (ESOC)</text>

  <text x="40" y="266" font-family="sans-serif" font-size="11" fill="#94a3b8">DELIVERY MODE</text>
  <rect x="40" y="276" width="248" height="36" rx="6" fill="#0b0f19" stroke="#334155" />
  <text x="52" y="299" font-family="sans-serif" font-size="12" fill="#ffffff">REAL_TIME Streaming</text>

  <rect x="40" y="330" width="248" height="40" rx="6" fill="#0284c7" />
  <text x="65" y="355" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">TRIGGER TELEMETRY CYCLE</text>

  <!-- 4 Metrics Cards -->
  <g transform="translate(324, 86)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="url(#card)" stroke="#334155" />
    <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">CSTS STATE</text>
    <text x="14" y="54" font-family="sans-serif" font-size="20" font-weight="bold" fill="#34d399">ACTIVE</text>
    <text x="14" y="70" font-family="sans-serif" font-size="9" fill="#38bdf8">State 3: Transferring</text>

    <rect x="166" y="0" width="150" height="80" rx="8" fill="url(#card)" stroke="#334155" />
    <text x="180" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">CARRIER LOCK</text>
    <text x="180" y="54" font-family="sans-serif" font-size="20" font-weight="bold" fill="#34d399">LOCKED</text>
    <text x="180" y="70" font-family="sans-serif" font-size="9" fill="#34d399">PLL Tracking Nominal</text>

    <rect x="332" y="0" width="150" height="80" rx="8" fill="url(#card)" stroke="#334155" />
    <text x="346" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">SYMBOL SNR (Eb/N0)</text>
    <text x="346" y="54" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">14.85 dB</text>
    <text x="346" y="70" font-family="sans-serif" font-size="9" fill="#34d399">&ge; 3.0 dB Threshold</text>

    <rect x="498" y="0" width="154" height="80" rx="8" fill="url(#card)" stroke="#334155" />
    <text x="512" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">ANTENNA POINTING</text>
    <text x="512" y="54" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">214.3° / 48.2°</text>
    <text x="512" y="70" font-family="sans-serif" font-size="9" fill="#38bdf8">Azimuth / Elevation</text>
  </g>

  <!-- Table -->
  <g transform="translate(324, 186)">
    <rect x="0" y="0" width="652" height="200" rx="10" fill="url(#card)" stroke="#334155" />
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">LIVE MONITORED TELEMETRY BUFFER (&sect;3.4)</text>

    <rect x="15" y="46" width="622" height="26" fill="#0b0f19" />
    <text x="25" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">PARAMETER NAME</text>
    <text x="210" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">UNIT</text>
    <text x="300" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">CURRENT VALUE</text>
    <text x="440" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">NOMINAL RANGE</text>
    <text x="570" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">STATUS</text>

    <text x="25" y="94" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">CARRIER_LOCK</text>
    <text x="210" y="94" font-family="sans-serif" font-size="11" fill="#94a3b8">Boolean</text>
    <text x="300" y="94" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">TRUE</text>
    <text x="440" y="94" font-family="sans-serif" font-size="11" fill="#ffffff">TRUE</text>
    <text x="570" y="94" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">NOMINAL</text>

    <text x="25" y="124" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">SYMBOL_SNR_DB</text>
    <text x="210" y="124" font-family="sans-serif" font-size="11" fill="#94a3b8">dB</text>
    <text x="300" y="124" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">14.85</text>
    <text x="440" y="124" font-family="sans-serif" font-size="11" fill="#ffffff">&ge; 3.0 dB</text>
    <text x="570" y="124" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">NOMINAL</text>

    <text x="25" y="154" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">ANTENNA_POINTING</text>
    <text x="210" y="154" font-family="sans-serif" font-size="11" fill="#94a3b8">deg</text>
    <text x="300" y="154" font-family="sans-serif" font-size="11" fill="#ffffff">214.3° / 48.2°</text>
    <text x="440" y="154" font-family="sans-serif" font-size="11" fill="#ffffff">Az: 0-360°, El: 10-88°</text>
    <text x="570" y="154" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">TRACKING</text>

    <text x="25" y="184" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">UPLINK_POWER_KW</text>
    <text x="210" y="184" font-family="sans-serif" font-size="11" fill="#94a3b8">kW</text>
    <text x="300" y="184" font-family="sans-serif" font-size="11" fill="#ffffff">18.5 kW</text>
    <text x="440" y="184" font-family="sans-serif" font-size="11" fill="#ffffff">1.0 – 20.0 kW</text>
    <text x="570" y="184" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">TRANSMIT</text>
  </g>

  <!-- Live XML Feed Terminal -->
  <g transform="translate(324, 404)">
    <rect x="0" y="0" width="652" height="170" rx="10" fill="#0b0f19" stroke="#334155" />
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#38bdf8">&lt;csts_md_message xmlns="urn:ccsds:schema:csts:md:1.0"&gt;</text>
    <text x="36" y="46" font-family="monospace" font-size="11" fill="#94a3b8">&lt;standard&gt;CCSDS 922.1-B-2&lt;/standard&gt;&lt;service_state&gt;ACTIVE&lt;/service_state&gt;</text>
    <text x="36" y="66" font-family="monospace" font-size="11" fill="#34d399">&lt;monitored_data_buffer seq="42"&gt;&lt;carrier_lock&gt;true&lt;/carrier_lock&gt;</text>
    <text x="36" y="86" font-family="monospace" font-size="11" fill="#ffffff">&lt;symbol_snr unit="dB"&gt;14.85&lt;/symbol_snr&gt;&lt;uplink_power unit="kW"&gt;18.5&lt;/uplink_power&gt;&lt;/monitored_data_buffer&gt;</text>
    <text x="20" y="106" font-family="monospace" font-size="11" fill="#38bdf8">&lt;/csts_md_message&gt;</text>
  </g>
</svg>
