<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="2" />

  <text x="40" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">MDCSTSForge Pro Architecture</text>
  <text x="40" y="70" font-family="sans-serif" font-size="12" fill="#38bdf8">CCSDS 922.1-B-2 Cross Support Transfer Services Monitored Data (MD-CSTS) Pipeline</text>

  <!-- Layer 1 -->
  <g transform="translate(40, 110)">
    <rect width="240" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">1. GROUND STATION (PROVIDER)</text>
    
    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Receiver RF &amp; Carrier Lock</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">Eb/N0 Symbol SNR, AGC</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Antenna Gimbal Tracking</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">Azimuth / Elevation Angles</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Transmitter RF Status</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">High-Power Amp (kW), Interlocks</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Doppler &amp; Metric Tracking</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Carrier Residual (Hz), Ranging</text>
  </g>

  <path d="M 280 280 L 330 280" stroke="#38bdf8" stroke-width="2" />

  <!-- Layer 2 -->
  <g transform="translate(330, 110)">
    <rect width="240" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">2. MD-CSTS ENGINE</text>
    
    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CSTS State Machine</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">UNBOUND &rarr; READY &rarr; ACTIVE</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">MD-TRANSFER-DATA</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">Periodic Parameter Buffering</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Threshold Notification Engine</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">Carrier Loss &amp; Low SNR Alarms</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Service Instance Manager</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">BIND / UNBIND / START / STOP</text>
  </g>

  <path d="M 570 280 L 620 280" stroke="#34d399" stroke-width="2" />

  <!-- Layer 3 -->
  <g transform="translate(620, 110)">
    <rect width="240" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">3. MISSION OPERATIONS (USER)</text>

    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Live Telemetry Dashboard</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">Glass-Cockpit MOC Oscilloscope</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CCSDS 922.1 XML Telemetry</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">SANA CSTS-MD Interchange</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Python 3 Automation CLI</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">Headless Integration Scripts</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">10-Point Normative Auditor</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">100% Certified Verification</text>
  </g>
</svg>
